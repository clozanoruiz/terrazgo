[workspace]
members = [
    "crates/terrazgo-core",
    "crates/terrazgo-net",
    "crates/terrazgo-geo",
    "crates/terrazgo-report",
    "crates/terrazgo-recordbook",
    "crates/module-cue",
    "crates/module-fertilisation",
    "crates/module-sigpac",
    "src-tauri",
]
resolver = "3"

# Shared package metadata; crates inherit with `<field>.workspace = true`.
[workspace.package]
version = "0.1.6"
edition = "2024"
# Floor set by rusqlite_migration 2.6; raise as dependencies demand.
rust-version = "1.95"
license = "AGPL-3.0-or-later"

# Manifest-enforced lints (crates opt in with `[lints] workspace = true`), so
# a plain `cargo check` flags them locally — not only CI's `-D warnings` run.
# unwrap/expect outside tests is a workspace hard rule; clippy.toml sets
# allow-unwrap-in-tests so test code stays idiomatic.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Single source of truth for shared dependency versions. Not just tidiness:
# `rusqlite::Connection` crosses the module-cue ↔ src-tauri boundary and
# libsqlite3-sys has `links = "sqlite3"`, so two incompatible rusqlite versions
# in the graph would be a hard build error. Crates opt in with `workspace = true`.
[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
uuid = { version = "1", features = ["v7"] }
jiff = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Catalogue CSV parsing (terrazgo-core): the FEGA Anexo VII files use RFC
# quoting with embedded ';' and newlines in their notes columns — real CSV,
# not split-on-delimiter territory.
csv = "1.3"
# JSON-Schema validation for the SIEX export tests (module-cue dev-dependency
# only — never in the shipped binary): the serializer's output is validated
# against the vendored official CUE schema. Default features pull an HTTP
# resolver (reqwest + rustls) for remote $refs; the vendored schema has none,
# so they stay off.
jsonschema = { version = "0.47", default-features = false }
# Sync HTTP for terrazgo-net, the app's single network seam (the map's
# cache-through fetch, the catalogue refresh). Kept out of core and modules —
# offline-first forbids network there. platform-verifier:
# TLS trust comes from the OS certificate store (like a browser) instead of
# pinned Mozilla roots — antivirus/proxy HTTPS interception re-signs traffic
# with a locally-installed CA that only the platform store knows.
ureq = { version = "3", features = ["platform-verifier"] }
# Android TLS bootstrap (terrazgo-net, Android-only): ureq's platform verifier
# reaches the Android trust store over JNI and panics on first use if it was
# never handed the JVM + app context (2026-07-17 field test: silent blank
# maps). terrazgo-net initializes it lazily before the first request with the
# handles tao's ndk_glue captures at activity creation. `tao` must resolve to
# the SAME crate copy tauri-runtime-wry links (its statics hold that context)
# and `jni` to the version rustls-platform-verifier's signatures use.
jni = { version = "0.21", default-features = false }
tao = { version = "0.35", default-features = false }
rustls-platform-verifier = "0.6"
# GPKG geometry blobs (WKB) → GeoJSON, for boundary-file import. `with-gpkg`
# deliberately NOT enabled: it pulls sqlx, and we read GeoPackage files (they
# are SQLite) with the rusqlite we already have.
geozero = { version = "0.15", default-features = false, features = ["with-wkb", "with-geojson"] }
# In-app PDF generation (terrazgo-report): Typst as a library — a real layout
# engine (automatic line/page breaking, repeating table headers) instead of
# per-document coordinate code. 0.x APIs: the caret on a 0.x version already
# locks the minor, so these only float patch releases. typst-as-lib is the
# World wrapper; its network-capable features (packages/reqwest/ureq — Typst
# Universe package downloads) are NOT default and stay off: templates and
# fonts are embedded, rendering is fully offline.
typst = "0.15"
# Direct dep only to NAME the output type (typst_layout::PagedDocument, which
# `typst` does not re-export); same version train, already in typst's tree.
typst-layout = "0.15"
typst-pdf = "0.15"
typst-as-lib = "0.16"
# In-app spreadsheet generation (terrazgo-report): the cuaderno also exports as
# .xlsx, where the farmer (or their gestoría) can sort, filter and sum — which
# needs REAL dates and numbers, not the pre-formatted Spanish strings the PDF
# template consumes. Write-only, pure Rust with no C anywhere in its tree
# (zlib-rs, not zlib), so Android cross-compilation is unaffected. Default
# features are empty; chrono/jiff/polars/serde integrations stay off — the
# engine takes plain values and ISO date strings.
rust_xlsxwriter = { version = "0.97", default-features = false }
# Locale-aware ordering for the names the record book prints
# (terrazgo-recordbook). SQLite's default BINARY collation orders by code
# point, so `Á` (U+00C1) sorts after `Z` (U+005A) and a plot called "Ángel"
# printed below "Zubiri"; a byte sort also puts "Parcela 10" before
# "Parcela 2". ICU4X is Unicode's own implementation and is PURE RUST, so it
# clears the bar that rejected C libproj and the SQLite ICU extension — and it
# reads the same CLDR data as the webview's Intl.Collator, so a picker on
# screen and a cell in the PDF agree by construction rather than by luck.
#
# Both crates were ALREADY in the tree, pulled by
# hayagriva -> typst-library -> typst -> terrazgo-report, with `compiled_data`
# already enabled — so this declares a requirement we were relying on by
# accident. Declaring it directly is what keeps the book compiling if Typst
# ever drops hayagriva. Cargo unifies our `^2.2` with hayagriva's own `2.2.0`
# into ONE copy; a future major split would compile two, which
# `cargo tree --duplicates` (and deny.toml's `bans` check, when it lands
# pre-release) is how we would notice.
icu_collator = "2.2"
# Only to name the locale a collator is built for (`locale!("es")`).
icu_locale_core = "2.2"
tauri = "2"
tauri-build = "2"
# Floor 2.7: that release removed the `confirm`/`ask` IPC commands (merged
# into `message`), and backend.js's confirmDialog() targets the 2.7+ shape.
tauri-plugin-dialog = "2.7"
# Android SAF: the native dialogs return content:// URIs there, not filesystem
# paths, and std::fs cannot open those (first field bug: 0-byte "saved" PDFs).
# The fs plugin resolves them to plain file descriptors through the platform
# ContentResolver — used Rust-side only (src-tauri/src/user_files.rs); no fs
# commands are exposed to the webview. Already in the tree via
# tauri-plugin-dialog. Floor 2.5: the minor whose Rust-side `Fs::open` does
# the content-URI resolution we invoke.
tauri-plugin-fs = "2.5"
# GPS position for the map's "which recinto am I standing on" lookup (P5).
# Mobile-only plugin (Android/iOS; desktop builds never see it); the webview
# calls it via raw invoke, so the floor is the minor whose command shapes
# (get_current_position / request_permissions) we code against.
tauri-plugin-geolocation = "2.3"
terrazgo-core = { path = "crates/terrazgo-core" }
# The network seam: the HTTP agent, its TLS trust policy, the offline
# diagnosis. Depended on by terrazgo-geo and the shell only — core and the
# modules must never name it (docs/architecture.md → "The network seam").
terrazgo-net = { path = "crates/terrazgo-net" }
terrazgo-geo = { path = "crates/terrazgo-geo" }
terrazgo-report = { path = "crates/terrazgo-report" }
# The record book is a top-layer CONSUMER: it depends on core and the domain
# modules and nothing depends on it but the shell. A module must never take it
# as a dependency -- that would invert the arrow the whole layering rests on.
terrazgo-recordbook = { path = "crates/terrazgo-recordbook" }
module-cue = { path = "crates/module-cue" }
# Fertilisation, irrigation and soil records (model sections 6, 7.1 and 8).
# A second regulatory domain on the same core, under a second decree
# (RD 1051/2022) with its own deadlines -- see docs/cuaderno-print.md.
module-fertilisation = { path = "crates/module-fertilisation" }
# SIGPAC lookups go through terrazgo-geo's fetch — module-sigpac itself has
# no HTTP dependency (the sanctioned-seam rule).
module-sigpac = { path = "crates/module-sigpac" }
