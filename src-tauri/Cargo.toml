[package]
name = "terrazgo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terrazgo desktop shell and core — module registry, migration runner, Tauri commands"

[lints]
workspace = true

# lib + thin main is the standard Tauri 2 shape; it also gives tests/ a library
# target to link against (the migration-composition tests need one).
[lib]
name = "terrazgo"
# rlib for the desktop binary + tests; cdylib is what the Android app loads;
# staticlib is for iOS when that milestone arrives.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
# Native save/open dialogs for backup export/import (added 2026-07-02).
tauri-plugin-dialog = { workspace = true }
# Opens the content:// URIs those dialogs return on Android (user_files.rs).
tauri-plugin-fs = { workspace = true }
# Hands a registry URL to the platform browser (external_links.rs). Rust-side
# only: the webview names a link by id, so it needs no opener permission.
tauri-plugin-opener = { workspace = true }
# OS name + version for the About panel's technical details (commands/app.rs).
os_info = { workspace = true }
# `demo` is enabled unconditionally because cargo features cannot be
# debug-profile-conditional; the seed command itself refuses in release builds.
module-cue = { workspace = true, features = ["demo"] }
module-fertilisation = { workspace = true }
# The eco-scheme registers (RD 1048/2022, model section 9).
module-ecoscheme = { workspace = true }
# The printable/exportable record book. A consumer crate above the modules: the
# shell asks it for a document, it reads core and the modules to build one.
terrazgo-recordbook = { workspace = true }
# The SIEX descriptor export: the second top-layer consumer, dormant but kept
# compiling and schema-validated (docs/siex-export.md).
terrazgo-siex = { workspace = true }
# SIGPAC parcel lookups (P3, 2026-07-08); network rides terrazgo-geo's fetch.
module-sigpac = { workspace = true }
terrazgo-core = { workspace = true }
# Geo plumbing: geo-cache.db, the geo:// protocol's fetch layer, map styles,
# boundary-file import (added 2026-07-07).
terrazgo-geo = { workspace = true }
# The network seam, used directly for the catalogue refresh: catalogue rows
# land in the app database via core's upsert importer, so there is nothing for
# terrazgo-geo's cache-through layer to do here — what is needed is the agent,
# its TLS policy and the offline diagnosis (src/catalogues.rs).
terrazgo-net = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# GPS for the map's point lookup (P5) — the plugin only supports Android/iOS,
# so desktop builds compile without it (lib.rs gates the init on `mobile`).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = { workspace = true }

# The RAII temp-path guard the shutdown test needs (it also sweeps the WAL
# sidecars, which is exactly what that test asserts about). Dev-only, and it
# depends on terrazgo-core alone.
[dev-dependencies]
terrazgo-testkit = { workspace = true }
