# Builds the per-platform installers for each v* tag and attaches them to a
# draft release. This workflow ships inside every source snapshot, so each
# release's binaries are built from exactly the source published at its tag —
# check out the tag and you are looking at what the installers were built from.
# Publishing the release (after writing the notes) is a manual step.
#
# Every artifact gets SLSA build provenance (signed into the public Sigstore
# ledger) and each release carries a CycloneDX SBOM attested against the
# installers. Verify any downloaded file with:
#
#   gh attestation verify <file> --repo clozanoruiz/terrazgo
name: Build release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # tauri (via wry/tao) links against the system webview stack on Linux.
      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # tauri-action runs beforeBuildCommand (npm run build) itself; only the
      # dependencies need installing here.
      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build installers and attach to the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Terrazgo ${{ github.ref_name }}"
          # Since v1 the action refuses a releaseDraft that disagrees with a
          # release that already exists. Both matrix jobs find the draft the
          # first one created, and a re-tag only ever re-targets an unpublished
          # draft, so the two always agree.
          releaseDraft: true
          # Early versions ship as pre-releases (see the README warning about
          # data not surviving upgrades); drop at the first stable release.
          prerelease: true
          uploadUpdaterJson: false

      # Windows also gets a "portable" download: the bare terrazgo.exe, zipped
      # (runs without installing; still needs the WebView2 runtime and keeps
      # its data in the user profile like the installed app). Zipped rather
      # than uploaded as a naked exe so browsers download it without warnings
      # and the filename carries the version.
      - name: Zip the portable build and attach it to the draft release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $zip = "terrazgo_${version}_x64_portable.zip"
          Compress-Archive -Path target/release/terrazgo.exe -DestinationPath $zip
          # --clobber keeps a re-tagged run idempotent.
          gh release upload $env:GITHUB_REF_NAME $zip --clobber

      # Attestation subjects are matched by digest, so any rename tauri-action
      # applies when uploading does not affect verification of the downloaded
      # assets. The portable download is attested as the zip itself — the file
      # a user actually downloads and can point gh attestation verify at.
      # actions/attest with no sbom-path or predicate writes SLSA build
      # provenance; attest-build-provenance has only wrapped it since v4.
      - name: Attest build provenance (Linux artifacts)
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/attest@v4
        with:
          subject-path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

      - name: Attest build provenance (Windows artifacts)
        if: matrix.platform == 'windows-latest'
        uses: actions/attest@v4
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            terrazgo_*_portable.zip

  # Android: a signed aarch64 APK is attached to the release for sideloading;
  # the AAB (the format Google Play requires) is kept as a workflow artifact
  # and uploaded to the Play internal-testing track by hand for now. Signing
  # reads the release keystore from repository secrets (ANDROID_KEYSTORE_B64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS); the job fails fast when
  # they are missing rather than producing an uninstallable unsigned build.
  # Note: the Play-installed app and this APK carry different signatures
  # (Play App Signing re-signs), so a device cannot update between the two
  # without an uninstall.
  android:
    # After the desktop matrix so the draft release exists for `gh release
    # upload`, and so a desktop build failure skips the Android spend.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK, but not necessarily the
      # platform `compileSdk` names or the NDK pin, so both are installed. The
      # versions match the local build recipe (docs/maintenance.md).
      - name: Install the Android NDK and SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-37.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Prebuilt cargo-tauri binary; compiling tauri-cli from source would add
      # ~10 minutes for nothing.
      # The binary pinned with the action: left out, the action downloads the
      # latest cargo-binstall whatever commit it is pinned to.
      - uses: cargo-bins/cargo-binstall@7bebc2e59eb8820162b7ac8f62a92bfdb2732447 # v1.25.1
        with:
          version: 1.25.1

      - name: Install the Tauri CLI
        run: cargo binstall --no-confirm tauri-cli@^2

      - name: Materialize the signing keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is not set — refusing to build an unsigned release APK"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Build the signed APK and AAB
        run: cargo tauri android build --apk --aab --target aarch64

      - name: Attach the APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="terrazgo_${version}_aarch64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          # --clobber keeps a re-tagged run idempotent.
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber

      # Not a release asset: Play users never sideload AABs, and shipping one
      # would only invite confusion. Fetched from the run page for the manual
      # Play upload until that step is automated.
      - name: Keep the AAB as a workflow artifact for the Play upload
        uses: actions/upload-artifact@v7
        with:
          name: terrazgo-${{ github.ref_name }}-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          if-no-files-found: error

      - name: Attest build provenance (Android artifacts)
        uses: actions/attest@v4
        with:
          subject-path: |
            terrazgo_*_aarch64.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab

  # One SBOM per release, derived from the lockfiles (Cargo.lock +
  # package-lock.json — dev-dependencies included, that is the lockfile
  # granularity), attached as a release asset and attested against the
  # installers built above.
  sbom:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: terrazgo-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Downloaded before the SBOM is uploaded, so the glob below is exactly
      # the set of installers.
      - name: Download the installers from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --dir assets

      # actions/attest-sbom is deprecated; actions/attest detects SBOM mode
      # from sbom-path and emits the same CycloneDX attestation.
      - name: Attest the SBOM against the installers
        uses: actions/attest@v4
        with:
          subject-path: assets/*
          sbom-path: terrazgo-${{ github.ref_name }}.cdx.json

      - name: Attach the SBOM to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --clobber keeps a re-tagged run idempotent.
        run: gh release upload "$GITHUB_REF_NAME" "terrazgo-${GITHUB_REF_NAME}.cdx.json" --clobber
