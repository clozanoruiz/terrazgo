[package]
name = "terrazgo-geo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terrazgo geo plumbing — tile/resource cache, base-map sources, boundary-file import (no user data, no UI)"

[lints]
workspace = true

# Versions live in [workspace.dependencies] at the repo root.
[dependencies]
terrazgo-core = { workspace = true }
# The HTTP agent, its TLS trust policy and the Android bootstrap. Extracted
# 2026-08-09 when the catalogue refresh became the second in-app consumer; the
# cache-through semantics around it stayed here.
terrazgo-net = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
geozero = { workspace = true }

# Shared test fixtures — specifically the RAII temp-path guard this crate's
# import tests introduced and now share with core's and module-cue's backup
# tests. It depends on terrazgo-core alone.
[dev-dependencies]
terrazgo-testkit = { workspace = true }
